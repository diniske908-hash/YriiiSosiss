<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Саида — запись</title>
<style>
  :root{
    --bg:#0e1621;--panel:#17212b;--in:#182533;--out:#2b5278;--txt:#e9edf1;--dim:#7d8b99;
    --acc:#4ea4f6;--ok:#3ecf8e;--line:#22303f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center}
  .phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}

  header{background:var(--panel);padding:10px 14px;display:flex;align-items:center;gap:10px;
         position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}
  .ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#4ea4f6,#7b5cff);
       display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
  .who{flex:1;min-width:0}
  .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:12px;color:var(--acc)}
  .more{color:var(--dim);font-size:18px;padding:0 4px}
  .bar{height:2px;background:#1b2836;position:sticky;top:60px;z-index:2}
  .bar span{display:block;height:100%;width:0;background:var(--acc);transition:width .35s ease}

  .chat{flex:1;padding:12px 10px 4px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overflow-x:hidden}
  .chat > *:first-child{margin-top:auto}
  .sys{align-self:center;background:rgba(255,255,255,.06);color:var(--dim);font-size:11px;
       padding:5px 10px;border-radius:20px;text-align:center;max-width:92%}

  .row{display:flex;flex-direction:column;max-width:86%}
  .row.out{align-self:flex-end;align-items:flex-end}
  .row.in{align-self:flex-start;align-items:flex-start}
  .row.block{width:86%}
  .msg{padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.36;white-space:pre-wrap;word-break:break-word;position:relative}
  .row.in .msg{background:var(--in);border-bottom-left-radius:4px}
  .row.out .msg{background:var(--out);border-bottom-right-radius:4px}
  .meta{font-size:10px;color:var(--dim);margin:2px 4px 0}
  .tick{color:var(--acc)}

  .kbd{display:grid;gap:6px;margin-top:6px;width:100%}
  .kbd.two{grid-template-columns:1fr 1fr}
  .kbd button{background:#232f3d;color:var(--txt);border:1px solid #2f3f52;border-radius:11px;
              padding:10px 11px;font-size:13.5px;font-family:inherit;cursor:pointer;text-align:left;
              display:flex;justify-content:space-between;gap:8px;align-items:center;transition:background .15s}
  .kbd button:hover{background:#2a3a4c;border-color:#3d5470}
  .kbd button .price{color:var(--dim);font-size:12px;white-space:nowrap}

  .card{background:#132030;border:1px solid var(--line);border-radius:14px;padding:12px 13px;width:100%;margin-top:6px}
  .card .title{font-weight:600;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
  .kv b{font-weight:600}
  .divider{height:1px;background:var(--line);margin:8px 0}

  .typing{display:flex;gap:4px;padding:12px 14px;background:var(--in);border-radius:14px;border-bottom-left-radius:4px;width:56px}
  .typing i{width:6px;height:6px;border-radius:50%;background:#7d8b99;animation:bounce 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

  .hint{font-size:11px;color:var(--dim);text-align:center;padding:6px 10px}
  footer{padding:8px 10px;background:var(--panel);display:flex;gap:8px;align-items:center;border-top:1px solid var(--line)}
  footer input{flex:1;min-width:0;background:#232f3d;border:1px solid #2f3f52;border-radius:11px;
               padding:9px 10px;color:var(--txt);font-size:14px;font-family:inherit}
  footer .send{background:var(--acc);color:#04121f;font-weight:600;border:0;border-radius:11px;padding:10px 13px;cursor:pointer}
  .spin{animation:spin 1s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="ava">С</div>
    <div class="who">
      <div class="name">Саида</div>
      <div class="sub">● бот онлайн · отвечает сразу</div>
    </div>
    <div class="more">⋯</div>
  </header>
  <div class="bar"><span id="progress"></span></div>
  <div class="chat" id="chat"></div>
  <div class="hint" id="hint"></div>
  <footer>
    <input id="txt" placeholder="Сообщение…" onkeydown="if(event.key==='Enter')sendText()">
    <button class="send" onclick="sendText()">➤</button>
  </footer>
</div>
<script>
const CLINIC = "Саида";
const PHONE = "+7 347 2164882;+7 927 9235060";
const ADDRESS = "";
const HOURS = "Ежедневно с 09:00 до 23:00";
const PRICES = ["Лечение кариеса — от 3 500 ₽", "Профессиональная гигиена — от 5 000 ₽", "Удаление зуба — от 2 500 ₽", "Имплантация зуба — от 25 000 ₽", "Брекет-система — от 30 000 ₽", "Протезирование — от 15 000 ₽"];
const SERVICES = ["Лечение", "Ортодонтия", "Хирургия", "Протезирование", "Имплантация", "Лечение десен"];
const FAQ = [{"q": "Как записаться на прием?", "a": "Позвоните по телефону +7 347 216-48-82 или +7 927 923-50-60."}, {"q": "Где находится клиника?", "a": "г. Уфа, Проспект Октября, д. 174/2 (ост. транспорта «ГДК»)."}, {"q": "Какие услуги предоставляет клиника?", "a": "Лечение, ортодонтия, хирургия, протезирование, имплантация, ремотерапия, плазмолифтинг десен, лечение десен аппаратом Вектор."}, {"q": "Есть ли гарантия на лечение?", "a": "Да, клиника гарантирует качество, использует современное оборудование и материалы."}];

const chat = document.getElementById('chat');
const progress = document.getElementById('progress');
const state = {step:0, name:'', service:'', time:'', total:4};

document.getElementById('hint').textContent =
  'демо для «' + CLINIC + '»' + (ADDRESS ? ' · ' + ADDRESS : '');

function now(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function setStep(n){
  state.step = n;
  progress.style.width = Math.min(100, Math.round((n / state.total) * 100)) + '%';
}

function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

function add(text, who='in', buttons=null, opts={}){
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const b = document.createElement('div');
  b.className = 'msg';
  b.textContent = text;
  row.appendChild(b);

  if (who === 'out'){
    const m = document.createElement('div');
    m.className = 'meta';
    m.innerHTML = now() + ' <span class="tick">✓✓</span>';
    row.appendChild(m);
  }
  chat.appendChild(row);

  if (buttons){
    const wrap = document.createElement('div');
    wrap.className = 'kbd' + (opts.two ? ' two' : '');
    buttons.forEach(btn=>{
      const el = document.createElement('button');
      el.innerHTML = '<span>' + btn.label + '</span>' +
                     (btn.price ? '<span class="price">' + btn.price + '</span>' : '');
      el.onclick = ()=>{ add(btn.label, 'out'); btn.action(); };
      wrap.appendChild(el);
    });
    const holder = document.createElement('div');
    holder.className = 'row in block';
    holder.appendChild(wrap);
    chat.appendChild(holder);
  }
  scrollDown();
  return row;
}

function card(rows){
  const holder = document.createElement('div');
  holder.className = 'row in block';
  const box = document.createElement('div');
  box.className = 'card';
  box.innerHTML = '<div class="title">Ваша запись</div>' +
    rows.map(r => r === '-' ? '<div class="divider"></div>'
      : '<div class="kv"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>').join('');
  holder.appendChild(box);
  chat.appendChild(holder);
  scrollDown();
}

function system(text){
  const d = document.createElement('div');
  d.className = 'sys';
  d.textContent = text;
  chat.appendChild(d);
  scrollDown();
}

// «бот печатает…» перед каждой репликой — как в живом мессенджере
let busy = false;
function bot(fn, delay=550){
  if (busy) return;
  busy = true;
  const holder = document.createElement('div');
  holder.className = 'row in';
  holder.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  chat.appendChild(holder);
  scrollDown();
  setTimeout(()=>{
    holder.remove();
    busy = false;
    fn();
  }, delay);
}

function priceFor(service){
  const key = service.toLowerCase().replace(/ё/g,'е').slice(0, 9);
  const found = (PRICES || []).find(p =>
    p.toLowerCase().replace(/ё/g,'е').includes(key));
  return found ? (found.split('—')[1] || '').trim() : '';
}

function mainMenu(){
  setStep(0);
  bot(()=>{
    add('Здравствуйте! Я бот клиники «' + CLINIC + '».\nЗапишу на приём за минуту — без звонков и без ожидания на линии.', 'in', [
      {label:'📅 Записаться на приём', action: askService},
      {label:'💰 Цены и услуги', action: showPrices},
      {label:'📍 Контакты и режим', action: showContacts},
      {label:'❓ Вопросы', action: faq}
    ]);
  }, 400);
}

function askService(){
  setStep(1);
  bot(()=>{
    add('На что планируете прийти?', 'in',
      (SERVICES || ['Консультация']).slice(0, 8).map(s => ({
        label: s, price: priceFor(s), action:()=>{ state.service = s; askTime(); }
      })));
  });
}

function askTime(){
  setStep(2);
  bot(()=>{
    add('Нашёл свободные окна на ближайшие дни. Какое удобнее?', 'in',
      ['Сегодня 18:00','Завтра 10:00','Завтра 15:30','Суббота 11:00'].map(t=>({
        label: t, action:()=>{ state.time = t; askName(); }
      })));
  });
}

function askName(){
  setStep(3);
  bot(()=>{ add('Как вас зовут?', 'in'); document.getElementById('txt').focus(); }, 450);
}

function askPhone(){ 
  bot(()=>{ add('Оставьте номер телефона — администратор подтвердит запись.', 'in'); document.getElementById('txt').focus(); }, 450);
}

function confirmBooking(){
  setStep(4);
  bot(()=>{
    add('Проверьте, всё верно?', 'in');
    card([
      ['Клиника', CLINIC],
      ['Услуга', state.service],
      ['Время', state.time],
      '-',
      ['Цена', priceFor(state.service) || 'уточнит врач'],
    ]);
    const holder = document.createElement('div');
    holder.className = 'row in block';
    const wrap = document.createElement('div');
    wrap.className = 'kbd two';
    const ok = document.createElement('button');
    ok.innerHTML = '<span>✅ Записаться</span>';
    ok.onclick = ()=>{ add('Записаться','out'); doneBooking(); };
    const edit = document.createElement('button');
    edit.innerHTML = '<span>✏️ Изменить</span>';
    edit.onclick = ()=>{ add('Изменить','out'); state.step=0; mainMenu(); };
    wrap.appendChild(ok); wrap.appendChild(edit);
    holder.appendChild(wrap);
    chat.appendChild(holder);
    scrollDown();
  }, 700);
}

function doneBooking(){
  setStep(5);
  state.total = 5;
  setStep(5);
  bot(()=>{
    add('Готово! Заявка у администратора — он подтвердит время в течение 15 минут и напишет сюда.\n\nНапомню о визите за день до приёма.', 'in', [
      {label:'📅 Добавить в календарь', action:()=>add('Ссылка на календарь ушла вам в чат 🙂','in')},
      {label:'← В начало', action: mainMenu}
    ]);
  }, 800);
}

function showPrices(){
  bot(()=>{
    add('Цены клиники «' + CLINIC + '»:', 'in');
    add((PRICES && PRICES.length ? PRICES.join('\n') : 'Прайс уточняется — спросите администратора.'), 'in', [
      {label:'📅 Записаться', action: askService},
      {label:'← Меню', action: mainMenu}
    ]);
  });
}

function showContacts(){
  bot(()=>{
    const lines = [];
    if (ADDRESS) lines.push('📍 ' + ADDRESS);
    if (PHONE) lines.push('📞 ' + PHONE);
    if (HOURS) lines.push('🕒 ' + HOURS);
    add(lines.join('\n') || 'Контакты уточняются.', 'in', [
      {label:'📅 Записаться', action: askService},
      {label:'← Меню', action: mainMenu}
    ]);
  });
}

function faq(){
  bot(()=>{
    const items = (FAQ || []).map(f => ({label: f.q, action:()=>{ add(f.q,'out'); add(f.a,'in'); }}));
    items.push({label:'← Меню', action: mainMenu});
    add('Частые вопросы:', 'in', items);
  });
}

function sendText(){
  const inp = document.getElementById('txt');
  const v = inp.value.trim();
  if(!v) return;
  add(v,'out'); inp.value='';
  if(state.step === 3){
    state.name = v;
    askPhone();
  } else if(state.step === 4 || state.name){
    confirmBooking();
  } else {
    bot(()=>add('Понял вас. Выберите вариант ниже 👇', 'in', [{label:'← В начало', action: mainMenu}]));
  }
}

system('Демо-бот клиники «' + CLINIC + '». Это пример — заявки никуда не уходят.');
mainMenu();

// Показ пути пациента: сразу при открытии (отключить — добавить #manual в адрес).
function playDemo(){
  if (location.hash === '#manual') return;
  system('Показываю пример: как пациент записывается за 4 шага');
  const step = (fn, ms) => setTimeout(fn, ms);
  step(()=>{ add('Записаться на приём','out'); askService(); }, 2200);
  step(()=>{ const first = (SERVICES && SERVICES[0]) || 'Консультация'; add(first,'out'); state.service = first; askTime(); }, 3600);
  step(()=>{ add('Завтра 10:00','out'); state.time = 'Завтра 10:00'; askName(); }, 4800);
  step(()=>{ add('Ирина','out'); state.name = 'Ирина'; confirmBooking(); }, 6200);
}
setTimeout(playDemo, 900);
</script>
</body>
</html>
